[package]
name = "mdeditor"
version = "1.0.3"
description = "Local-first Markdown viewer and editor"
authors = ["mdeditor"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mdeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "charset",
  "http2",
] }
tauri-plugin-single-instance = "2.0.0-rc.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
