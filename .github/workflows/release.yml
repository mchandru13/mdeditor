name: Release

# Publishing is triggered by pushing a version tag, which is the only thing that
# can create a GitHub Release. A manual run builds the installers and keeps them
# as workflow artifacts, so the packaging path can be exercised without shipping.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build and publish installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # An installer whose file name says 1.0.0 but whose tag says 1.0.2 is worse
      # than no release, so the three version fields are required to agree with
      # each other and with the tag.
      - name: Verify tag and version agree
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($packageVersion -ne $version -or $cargoVersion -ne $version) {
            throw "Versions disagree: package.json=$packageVersion Cargo.toml=$cargoVersion tauri.conf.json=$version. Bump all three before tagging."
          }
          if ("${{ github.event_name }}" -eq "push" -and "v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version $version. Expected v$version."
          }
          Write-Host "Version $version matches the tag."
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build application and installers
        run: npm run tauri:build

      - name: Stage installers
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "installers"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" $staging
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" $staging
          Get-ChildItem $staging | ForEach-Object { "{0}  {1:N2} MiB" -f $_.Name, ($_.Length / 1MB) }
          "STAGING=$staging" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ github.ref_name }}
          path: ${{ runner.temp }}/installers/*
          if-no-files-found: error

      # Runs on manual builds too, so the note and checksum generation is not
      # first exercised on a real release.
      - name: Compose release notes
        shell: pwsh
        run: |
          $rows = Get-ChildItem $env:STAGING | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            '| `{0}` | `{1}` |' -f $_.Name, $hash
          }
          $checksums = @('', '## Checksums', '', '| File | SHA-256 |', '|---|---|') + $rows
          $notes = (Get-Content .github/release-notes.md -Raw) -replace '\{version\}', $env:APP_VERSION
          $notes = $notes.TrimEnd() + "`n" + ($checksums -join "`n") + "`n"
          $path = Join-Path $env:RUNNER_TEMP "notes.md"
          Set-Content -Path $path -Value $notes -Encoding utf8
          "NOTES=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "--- notes preview ---"
          Get-Content $path | Select-Object -First 4
          Get-Content $path | Select-Object -Last 6

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Markdown Editor ${{ env.APP_VERSION }}
          body_path: ${{ env.NOTES }}
          files: ${{ runner.temp }}/installers/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
