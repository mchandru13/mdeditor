name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript, tests and browser check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      # check:ui drives the built UI in Edge, the same Chromium engine WebView2
      # uses. It is the only automated check that would catch a broken preview.
      #
      # The server and the check share one step on purpose: a server started in an
      # earlier step is reaped when that step ends, which reads as
      # ERR_CONNECTION_REFUSED five seconds later.
      - name: Browser check
        shell: pwsh
        run: |
          $preview = Start-Process -FilePath "npm.cmd" -ArgumentList "run", "preview" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\preview.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\preview.err" `
            -NoNewWindow -PassThru

          $ready = $false
          foreach ($attempt in 1..60) {
            try {
              if ((Invoke-WebRequest http://localhost:4173 -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) {
                $ready = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) {
            Get-Content "$env:RUNNER_TEMP\preview.log", "$env:RUNNER_TEMP\preview.err" -ErrorAction SilentlyContinue
            throw "The preview server did not become reachable on port 4173."
          }

          node scripts/browser-check.mjs http://localhost:4173
          if ($LASTEXITCODE -ne 0) {
            throw "The browser check failed with exit code $LASTEXITCODE."
          }

          # The check passes or the step fails here either way, so the preview
          # server is only stopped to keep the job's process tree clean.
          taskkill.exe /T /F /PID $preview.Id | Out-Null

  native:
    name: Rust tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # tauri-build reads the frontend dist at compile time and fails without it,
      # so the frontend is built before cargo test.
      - name: Build frontend
        run: npm run build

      - name: Rust tests
        run: npm run test:rust
